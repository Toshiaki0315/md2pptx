# project_a.yaml - プロジェクトA専用のPowerPoint生成設定

# --- スライド全体の基本設定 ---
slides:
  # 既存のPPTXテンプレートを使用する場合はパスを指定（社内ロゴ入りなど）
  # template_path: "project_a_template.pptx"
  template_path: null

  # スライドの画角（縦横比）
  # 16:9 (ワイド画面), 4:3 (標準), 16:10, A4
  # template_path が指定されている場合、この設定は無視されます。
  layout: "16:9"
  
  # スライド番号の表示（右下）
  show_slide_number: true

# --- Mermaid図の生成方法 ---
# ⚠ 図のソースには社内システムの構成やデータフローが含まれ得ます。
#    既定の "kroki" は外部の公開サービスへ図の内容を送信します。
mermaid:
  # kroki : Kroki で画像化する（endpoint を変えれば自己ホストも可能）
  # local : mermaid-cli (mmdc) でオフライン生成する（外部送信なし）
  #         要インストール: npm install -g @mermaid-js/mermaid-cli
  # off   : Mermaid図を生成しない
  renderer: "kroki"

  # Krokiのエンドポイント。社内に自己ホストしたKrokiを指定すれば情報は外部に出ません。
  # 例: "http://kroki.internal.example.com"
  endpoint: "https://kroki.io"

  # 公開サービスへ送信する際に警告を表示する
  warn_on_external: true

  # Kroki障害時に公開API(mermaid.ink)へフォールバックするか。
  # 未指定の場合は「公開エンドポイントを使っているときのみ許可」します。
  # 自己ホストを指定している場合に true にすると、障害時に図が外部へ送信されるので注意。
  # fallback_to_public: false

  # renderer: local のときに使うコマンド
  # cli_path: "mmdc"

# --- カラーテーマの一括設定 ---
theme:
  accent_color: [0, 112, 192]   # 見出し・テーブルヘッダーの基本色
  text_color: [50, 50, 50]      # 本文の基本色
  code_bg_color: [40, 44, 52]   # コードブロックの背景色

# --- テキストのフォント設定 ---
# ※テーマ設定がある場合、color_rgbはテーマの色で上書きされます。
# 実行するOSにインストールされているフォントを指定してください。
fonts:
  title_h1:          # タイトルスライド（#）用
    name: "Meiryo"
    size_pt: 44
    bold: true
  title_h2:          # コンテンツスライド（##）用
    name: "Meiryo"
    size_pt: 32
    bold: true
  body:
    name: "Meiryo"
    size_pt: 18
  # 箇条書き（liタグ）レベル1の設定
  bullet_level_1:
    name: "Yu Gothic"
    size_pt: 18
    bold: false
    color_rgb: [50, 50, 50] # 少し薄い灰色
  inline_code:
    name: "Consolas"
    color_rgb: [220, 20, 60] # クリムゾンレッド
  code_block:
    name: "Consolas"
    size_pt: 12
    color_rgb: [0, 80, 160] # ブルーグレー
# --- 画像の配置設定 ---
images:
  default_height_inches: 3.5

  # --- 埋め込み画像の自動縮小（ファイルサイズ削減） ---
  # スライド上の表示サイズに対して解像度が過大な画像を再サンプリングします。
  # 元より小さくならない場合や、元画像が十分小さい場合は何もしません。
  downscale: true
  # 再サンプリング後の解像度。150=印刷品質相当、96=画面表示相当（より小さくなる）
  dpi: 150

  # 画像の配置位置（スライドの左上を (0,0) としたインチ単位）
  # [左からの距離, 上からの距離]
  # 16:9のスライド（10.0 x 5.625インチ）に対して、右下に配置
  # ここが設定されているとオートレイアウトが効かないので消すかコメントアウト  
  # position_inches: [5.2, 1.8]