[mypy]
# サードパーティ製ライブラリ（requests / PyYAML / markdown 等）の型スタブは
# 任意導入とし、未導入の環境でも型チェックを実行できるようにする。
# 導入する場合: pip install types-requests types-PyYAML types-Markdown
ignore_missing_imports = True
disable_error_code = import-untyped

# テストコードはモックを多用するため、型チェックの対象外とする
[mypy-test_md2pptx]
ignore_errors = True
