# md2pptx はパッケージとして配布せず、スクリプトとして実行する構成のため、
# このファイルは開発ツールの設定置き場として使用する。
# 依存関係は requirements.txt / requirements-dev.txt を参照。

[tool.pytest.ini_options]
# `pytest` だけでカバレッジまで計測する
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = [
    "md2pptx",
    "generator",
    "processors",
    "table_render",
    "utils",
    "layout",
    "text_metrics",
    "font_metrics",
    "mermaid_renderer",
    "config_schema",
    "extractor",
    "pptx2md",
    "gui_config",
    "gui_deps",
    "gui_runner",
    "make_template",
]

# gui.py は tkinter に依存し、tkinter を含まないPython（pyenvの既定など）では
# import すらできないため、計測対象から外す。画面に依存しない処理は
# gui_config / gui_deps / gui_runner に切り出し、そちらで計測する。
omit = ["gui.py"]

[tool.mypy]
# サードパーティ製ライブラリの型スタブは任意導入とし、
# 未導入の環境でも型チェックを実行できるようにする
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
# テストコードはモックを多用するため、型チェックの対象外とする
module = "test_md2pptx"
ignore_errors = true
